[project]
name = "wifi-csi-fall-detection"
version = "0.1.0"
description = "Research and proof-of-concept development for WiFi CSI-based fall detection"
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
]

[project.scripts]
wifall = "wifall.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
